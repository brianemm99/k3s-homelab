# Schedules every Deployment, StatefulSet and CronJob in an app on the tower
# Opt in from an app's kustomization.yaml with:
#   components:
#     - <relative path>/components/tower
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: "(Deployment|StatefulSet)" }
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: any}      # ignored: the target line picks the resources
      spec:
        template:
          spec:
            nodeSelector: {homelab/role: compute}
            tolerations:
              - {key: homelab/compute, operator: Exists, effect: NoSchedule}
  - target: { kind: CronJob }
    patch: |-
      apiVersion: batch/v1
      kind: CronJob
      metadata: {name: any}
      spec:
        jobTemplate:
          spec:
            template:
              spec:
                nodeSelector: {homelab/role: compute}
                tolerations:
                  - {key: homelab/compute, operator: Exists, effect: NoSchedule}
