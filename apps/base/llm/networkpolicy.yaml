# Inbound: only Open WebUI and the Tailscale ingress proxies.
# This keeps cloudflared and n8n (public-facing) from ever reaching the model.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-server-ingress
spec:
  podSelector:
    matchLabels:
      app: llama-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: open-webui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 8080
---
# Outbound: nothing. Listing Egress with no rules blocks every outbound
# connection, DNS included; llama-server never needs to reach anything.
# download-policy.yaml adds a temporary exception for the model download.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llama-server-deny-egress
spec:
  podSelector:
    matchLabels:
      app: llama-server
  policyTypes:
    - Egress
