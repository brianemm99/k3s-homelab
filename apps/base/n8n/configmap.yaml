apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-configmap
  namespace: n8n
data:
  DB_TYPE: sqlite
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  N8N_HOST: n8n.brianemm99.net
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_PORT: "3008"
  N8N_PROTOCOL: http
  N8N_PROXY_HOPS: "1"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

  WEBHOOK_URL: https://n8n.brianemm99.net/
  N8N_EDITOR_BASE_URL: https://n8n.brianemm99.net/

  GENERIC_TIMEZONE: America/New_York
  TZ: America/New_York
