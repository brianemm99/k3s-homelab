apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: automation
    app.kubernetes.io/instance: n8n
    app.kubernetes.io/name: n8n
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
        app.kubernetes.io/component: automation
        app.kubernetes.io/instance: n8n
        app.kubernetes.io/name: n8n
        policy-type: app
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: n8n-configmap
            - secretRef:
                name: n8n-secrets
          image: docker.n8n.io/n8nio/n8n:2.44.7
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 3008
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          name: n8n
          ports:
            - containerPort: 3008
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 3008
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
          volumeMounts:
            - mountPath: /home/node/.n8n
              name: n8n-data
      initContainers:
        - command:
            - sh
            - -c
            - chown -R 1000:1000 /data
          image: busybox:1.37
          name: fix-permissions
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /data
              name: n8n-data
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
