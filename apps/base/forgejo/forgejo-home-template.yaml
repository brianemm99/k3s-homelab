# Custom Forgejo landing page (signed-out visitors only; signed-in users get the dashboard).
# subPath mounts don't pick up ConfigMap changes, so after editing:
#   kubectl -n forgejo rollout restart deploy/forgejo
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-home-template
  namespace: forgejo
data:
  home.tmpl: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>brianemm99 · Homelab</title>
      <meta name="description" content="brianemm99's homelab and self-hosted git.">
      <link rel="icon" href="{{AssetUrlPrefix}}/img/favicon.svg" type="image/svg+xml">
      <link rel="alternate icon" href="{{AssetUrlPrefix}}/img/favicon.png" type="image/png">
      <!-- Only third-party request on the page. Delete these three lines to fall back to system fonts. -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
      {{template "custom/header" .}}
      <style>
        :root {
          --bg: #141213;
          --panel: #100e0f;
          --text: #d4cfcc;
          --text-strong: #e2ddd9;
          --muted: #a29b97;
          --faint: #8a8380;
          --red-deep: #5c1218;
          --red: #8f1d22;
          --red-bright: #e0614f;
          --orange: #f07a3a;
          --orange-light: #ff9a4d;
          --ink: #1a0f0b;
          --line: rgba(255, 255, 255, .08);
          --ease: cubic-bezier(.2, .7, .2, 1);
          --sans: Geist, Inter, system-ui, sans-serif;
          --mono: "JetBrains Mono", ui-monospace, monospace;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; background: var(--bg); }
        body { color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
        a { color: var(--text); text-decoration: none; }
        a:hover { color: #fff; }
        a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; border-radius: 6px; }

        .page { position: relative; min-height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .glow {
          position: absolute; left: 0; top: 0; width: 900px; height: 900px; pointer-events: none;
          background: radial-gradient(closest-side, rgba(143,29,34,.5), rgba(92,18,24,.18) 60%, rgba(19,17,18,0));
          transform: translate(560px, -40px);
          transition: transform 1.4s cubic-bezier(.16, .8, .24, 1);
          will-change: transform;
        }
        .wrap { position: relative; max-width: 1200px; width: 100%; margin: 0 auto; }

        /* nav */
        header { position: relative; padding: 28px 32px 0; }
        nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; letter-spacing: -.015em; color: var(--text-strong); }
        .brand img { width: 34px; height: 34px; }
        .pills { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: rgba(28,25,26,.6); }
        .pills a { padding: 9px 16px; border-radius: 999px; font-size: 14px; color: var(--muted); transition: background .25s ease, color .25s ease; }
        .pills a:hover { background: rgba(255,255,255,.05); color: var(--text-strong); }

        /* hero */
        main { position: relative; flex-grow: 1; display: flex; align-items: center; padding: 64px 32px; }
        .hero { display: flex; flex-wrap: wrap; align-items: center; gap: 64px; }
        .intro { flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 24px; }
        .eyebrow { margin: 0; font-family: var(--mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--orange); }
        h1 { margin: 0; font-size: clamp(52px, 7vw, 104px); line-height: 1; font-weight: 600; letter-spacing: -.045em; color: var(--text-strong); }
        .words { display: inline-grid; color: var(--orange); }
        .word {
          grid-area: 1 / 1; opacity: 0; transform: translateY(18px); filter: blur(6px);
          transition: opacity .7s ease, transform .7s var(--ease), filter .7s ease;
        }
        .word.is-active { opacity: 1; transform: none; filter: none; }
        .word.is-prev { transform: translateY(-18px); }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
        .currently {
          margin: 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
          padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(28,25,26,.7);
          font-size: 14px; color: var(--muted);
        }
        .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--orange); animation: pulse 2.4s ease-in-out infinite; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
        .btn { display: inline-flex; align-items: center; padding: 15px 24px; border-radius: 14px; font-size: 16px; font-weight: 500; }
        .btn-primary { background: var(--orange); color: var(--ink); font-weight: 600; transition: transform .3s var(--ease), box-shadow .3s ease; }
        .btn-primary:hover { color: var(--ink); transform: translateY(-2px); box-shadow: 0 10px 40px -8px rgba(240,122,58,.55); }
        .btn-ghost { border: 1px solid rgba(255,255,255,.12); transition: border-color .3s ease, background .3s ease; }
        .btn-ghost:hover { border-color: rgba(240,122,58,.5); background: rgba(143,29,34,.18); }

        /* tmux card */
        .card-col { flex: 1 1 440px; min-width: 0; display: flex; justify-content: center; }
        .float { width: 100%; max-width: 520px; }
        .term {
          display: flex; flex-direction: column; overflow: hidden; border-radius: 10px;
          border: 1px solid rgba(240,122,58,.28); background: rgba(16,14,15,.94); backdrop-filter: blur(12px);
          font-family: var(--mono); font-size: 13px; line-height: 1.75; color: var(--muted);
          transition: transform .45s var(--ease), border-color .35s ease, box-shadow .45s ease;
        }
        .term:hover { color: var(--muted); transform: translateY(-4px); border-color: rgba(240,122,58,.55); box-shadow: 0 30px 80px -30px rgba(143,29,34,.9); }
        .pane { display: flex; flex-direction: column; gap: 4px; padding: 18px 20px 20px; }
        .pane > div { overflow-wrap: anywhere; }
        .u { color: var(--orange); font-weight: 700; }
        .p { color: var(--faint); }
        .t { color: var(--red-bright); }
        .s { color: var(--text-strong); }
        .c { color: var(--text); }
        .fetch { display: flex; align-items: center; gap: 22px; padding: 10px 0 12px; }
        .fetch pre { margin: 0; font-family: var(--mono); }
        .branch { flex-shrink: 0; font-size: 16px; line-height: 1.15; font-weight: 700; }
        .branch .o { color: var(--orange); }
        .branch .r { color: var(--red-bright); }
        .info { min-width: 0; font-size: 13px; line-height: 1.75; color: var(--muted); }
        .info pre { font-size: 13px; line-height: 1.75; }
        .info .k { color: var(--red-bright); }
        .info .rule { color: #5e5654; }
        .swatches { display: flex; margin-top: 8px; }
        .swatches span { width: 18px; height: 12px; }
        .caret { display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: var(--text); animation: blink 1.1s steps(1) infinite; }
        .status { display: flex; align-items: stretch; justify-content: space-between; background: #1f1a1b; border-top: 1px solid rgba(255,255,255,.05); font-size: 12px; line-height: 1; }
        .status span { display: flex; align-items: center; padding: 8px 10px; }
        .status .session { padding: 8px 12px; background: var(--red); color: #f3e9e4; font-weight: 700; }
        .status .win { color: var(--faint); }
        .status .win.active { color: var(--orange); font-weight: 700; }
        .status .go {
          gap: 8px; padding: 8px 14px; background: var(--orange); color: var(--ink); font-weight: 700;
          transition: padding .35s var(--ease), background .3s ease;
        }
        .term:hover .go { padding-right: 20px; background: var(--orange-light); }
        .left { display: flex; }

        /* footer */
        footer { position: relative; padding: 24px 32px 28px; }
        .foot {
          display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
          padding-top: 20px; border-top: 1px solid rgba(255,255,255,.06);
          font-family: var(--mono); font-size: 12px; color: var(--faint);
        }
        .foot a { display: inline-flex; align-items: center; gap: 8px; color: var(--faint); transition: color .25s ease; }
        .foot a:hover { color: var(--text-strong); }
        .foot img { width: 18px; height: 18px; }

        /* load-in + ambient motion */
        .rise { animation: rise .9s var(--ease) both; }
        .d1 { animation-delay: .08s; } .d2 { animation-delay: .18s; } .d3 { animation-delay: .3s; } .d4 { animation-delay: .42s; }
        @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
        @media (prefers-reduced-motion: reduce) {
          .rise, .caret, .dot { animation: none; }
          .glow, .word, .term, .btn-primary { transition: none; }
        }
      </style>
    </head>
    <body>
    <div class="page" id="page">
      <div class="glow" id="glow" aria-hidden="true"></div>

      <header>
        <nav class="wrap" aria-label="Main">
          <a class="brand" href="{{AppSubUrl}}/">
            <img src="{{AssetUrlPrefix}}/img/logo.svg" alt="">
            brianemm99
          </a>
          <div class="pills">
            <a href="{{AppSubUrl}}/brianemm99/k3s-homelab">Homelab</a>
            <a href="{{AppSubUrl}}/brianemm99/dotfiles">Dotfiles</a>
            <!-- hidden on the public host by custom/header.tmpl -->
            <a href="{{AppSubUrl}}/user/login">Sign in</a>
          </div>
        </nav>
      </header>

      <main>
        <div class="wrap hero">
          <div class="intro">
            <p class="eyebrow rise">Homelab</p>
            <h1 class="rise d1">
              I build<br>
              <span class="words" id="words" aria-hidden="true"></span>
              <span class="sr-only" id="words-sr"></span>
            </h1>
            <p class="currently rise d2">
              <span class="dot" aria-hidden="true"></span>
              Currently studying for the CKA and running k3s on a mini NAS
            </p>
            <div class="actions rise d3">
              <a class="btn btn-primary" href="{{AppSubUrl}}/brianemm99">View profile</a>
              <a class="btn btn-ghost" href="{{AppSubUrl}}/explore/repos">Repositories</a>
            </div>
          </div>

          <div class="card-col rise d4">
            <div class="float">
              <a class="term" href="{{AppSubUrl}}/brianemm99" aria-label="Open the brianemm99 profile">
                <div class="pane">
                  <div><span class="u">brianemm99@homelab</span><span class="p">:</span><span class="t">~</span><span class="s">$</span> <span class="c">fastfetch</span></div>
                  <div class="fetch">
    <pre class="branch" aria-hidden="true"><span class="o">  (O)</span><span class="r">   (O)</span>
    <span class="o">   |</span><span class="r">     |</span>
    <span class="o">   |</span><span class="r">     |</span>
    <span class="o">   |</span><span class="r">    /</span>
    <span class="o">   |</span><span class="r">  _/</span>
    <span class="o">   |</span><span class="r">_/</span>
    <span class="o">   |</span>
    <span class="o">   |</span>
    <span class="o">  (O)</span></pre>
                    <div class="info">
    <pre><span class="u">brianemm99</span><span class="p">@</span><span class="u">homelab</span>
    <span class="rule" aria-hidden="true">──────────────────</span>
    <span class="k">OS</span>      Ubuntu Server
    <span class="k">Host</span>    Beelink ME mini
    <span class="k">Cluster</span> k3s + flux
    <span class="k">CNI</span>     cilium
    <span class="k">Git</span>     forgejo</pre>
                      <div class="swatches" aria-hidden="true">
                        <span style="background:#141213"></span><span style="background:#5c1218"></span><span style="background:#8f1d22"></span><span style="background:#d40000"></span><span style="background:#f07a3a"></span><span style="background:#ff9a4d"></span><span style="background:#a29b97"></span><span style="background:#d4cfcc"></span>
                      </div>
                    </div>
                  </div>
                  <div><span class="u">brianemm99@homelab</span><span class="p">:</span><span class="t">~</span><span class="s">$</span> <span class="c">git clone git.brianemm99.net/brianemm99/k3s-homelab</span></div>
                  <div class="p">Cloning into 'k3s-homelab'...</div>
                  <div><span class="u">brianemm99@homelab</span><span class="p">:</span><span class="t">~</span><span class="s">$</span> <span class="caret" aria-hidden="true"></span></div>
                </div>
                <div class="status">
                  <div class="left">
                    <span class="session">[homelab]</span>
                    <span class="win active">0:bash*</span>
                    <span class="win">1:k9s</span>
                    <span class="win">2:nvim</span>
                  </div>
                  <span class="go">open profile
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
                  </span>
                </div>
              </a>
            </div>
          </div>
        </div>
      </main>

      <footer>
        <div class="wrap foot">
          <span>served from a k3s homelab</span>
          <a href="https://forgejo.org">powered by <img src="{{AssetUrlPrefix}}/img/logo.svg" alt=""> Forgejo</a>
        </div>
      </footer>
    </div>

    <script>
    (function () {
      // Edit this list to change the rotating headline words.
      var WORDS = ["clusters", "pipelines", "homelabs", "automations"];
      var INTERVAL_MS = 2600;

      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Rotating word
      var box = document.getElementById("words");
      document.getElementById("words-sr").textContent = WORDS.join(", ") + ".";
      var spans = WORDS.map(function (w, i) {
        var s = document.createElement("span");
        s.className = "word" + (i === 0 ? " is-active" : "");
        s.textContent = w + ".";
        box.appendChild(s);
        return s;
      });
      var idx = 0;
      if (spans.length > 1) {
        setInterval(function () {
          var prev = idx;
          idx = (idx + 1) % spans.length;
          spans.forEach(function (s) { s.classList.remove("is-prev"); });
          spans[prev].classList.remove("is-active");
          spans[prev].classList.add("is-prev");
          spans[idx].classList.add("is-active");
        }, INTERVAL_MS);
      }

      // Glow follows the pointer
      if (!reduce) {
        var page = document.getElementById("page");
        var glow = document.getElementById("glow");
        var raf = 0, x = 0, y = 0;
        page.addEventListener("pointermove", function (e) {
          var r = page.getBoundingClientRect();
          x = Math.round(e.clientX - r.left - 450);
          y = Math.round(e.clientY - r.top - 450);
          if (raf) return;
          raf = requestAnimationFrame(function () {
            raf = 0;
            glow.style.transform = "translate(" + x + "px, " + y + "px)";
          });
        });
      }
    })();
    </script>
    </body>
    </html>
